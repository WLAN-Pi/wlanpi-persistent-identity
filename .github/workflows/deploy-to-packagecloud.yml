name: Deploy to Packagecloud

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'debian/changelog'

permissions:
  contents: read
  actions: read

jobs:
  format:
    name: Get formatted version for filename
    uses: WLAN-Pi/gh-workflows/.github/workflows/get-formatted-version-string.yml@main

  sbuild_deploy:
    name: sbuild deploy pkg
    needs:
      - format
    uses: WLAN-Pi/gh-workflows/.github/workflows/sbuild-deploy-pkg.yml@main
    with:
      pkg: wlanpi-persistent-identity
      version: ${{ needs.format.outputs.version }}
      distros: '["trixie"]'
    secrets: inherit

  tag:
    name: Tag the release
    needs:
      - sbuild_deploy
    permissions:
      contents: write
    uses: WLAN-Pi/gh-workflows/.github/workflows/tag-release.yml@393538aeaf6a6954d078f1bef10a4df91bfa3aad

  slack-workflow-status:
    if: ${{ always() && github.repository_owner == 'WLAN-Pi' && ! github.event.pull_request.head.repo.fork }}
    name: Post Workflow Status to Slack
    needs:
      - sbuild_deploy
      - tag
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@2e709ce51fd47f02b7221db8547e6e6f49f81f1d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
