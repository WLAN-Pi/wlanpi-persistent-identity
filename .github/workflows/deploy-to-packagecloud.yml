name: Deploy to Packagecloud

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'debian/changelog'

permissions:
  contents: read
  actions: read

jobs:
  format:
    name: Get formatted version for filename
    uses: WLAN-Pi/gh-workflows/.github/workflows/get-formatted-version-string.yml@main

  sbuild_deploy:
    name: sbuild deploy pkg
    needs:
      - format
    uses: WLAN-Pi/gh-workflows/.github/workflows/sbuild-deploy-pkg.yml@main
    with:
      pkg: wlanpi-persistent-identity
      version: ${{ needs.format.outputs.version }}
      distros: '["trixie"]'
    secrets: inherit

  tag:
    name: Tag the release
    needs:
      - sbuild_deploy
    permissions:
      contents: write
    uses: WLAN-Pi/gh-workflows/.github/workflows/tag-release.yml@393538aeaf6a6954d078f1bef10a4df91bfa3aad

  discord-workflow-status:
    if: ${{ always() && github.repository_owner == 'WLAN-Pi' && ! github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    name: Post Workflow Status to Discord
    needs:
      - sbuild_deploy
      - tag
    uses: WLAN-Pi/gh-workflows/.github/workflows/discord-workflow-status.yml@main
    permissions:
      actions: read
      contents: read
    with:
      parent_run_id: ${{ github.run_id }}
    secrets: inherit
